name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual publish of an existing tag, e.g. to retry a failed release.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish, e.g. v1.0.0'
        required: true
      dist_tag:
        description: 'npm dist-tag (use something other than "latest" for an older version)'
        required: true
        default: 'latest'

# Publishes via npm trusted publishing (OIDC): no NPM_TOKEN secret needed.
# Configure it at npmjs.com → openf1-js → Settings → Trusted publishing.
permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org/'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
